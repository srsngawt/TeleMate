name: Update Clean Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Filter & Deduplication Script
        run: |
          python3 scripts/playlist_filter.py

      - name: Commit and Push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clean_india.m3u
          if git diff --staged --quiet; then
            echo "No changes in playlist"
          else
            git commit -m "Auto-update: Refresh verified channels [skip ci]"
            git push
          fi
